<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بازبینی صداها</title>
<style>
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; background: #fff8ec; color: #2b2118; }
  h1 { font-size: 1.3rem; }
  p.راهنما { color: #7a6a58; }
  .کلمه { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 2px solid #eadcc6; border-radius: 10px; margin-bottom: 6px; background: #fff; }
  .کلمه.پرچم { border-color: #e2504c; background: #fde3e0; }
  .کلمه span.واژه { flex: 1; font-size: 1.1rem; }
  .کلمه small { color: #7a6a58; }
  button { font: inherit; border-radius: 8px; border: 2px solid #1fa5a0; background: #fff; padding: 6px 10px; cursor: pointer; }
  button.پخش { font-size: 1.2rem; }
  button.پرچم-دکمه { border-color: #e2504c; }
  .کلمه.پرچم button.پرچم-دکمه { background: #e2504c; color: #fff; }
  #نوار { position: sticky; top: 0; background: #fff8ec; padding: 10px 0; display: flex; gap: 10px; align-items: center; }
  #شمار { font-weight: 700; }
  textarea { width: 100%; height: 90px; font: 13px monospace; direction: ltr; }
</style>
</head>
<body>
<h1>بازبینی صداها</h1>
<p class="راهنما">هر کلمه را گوش کن. اگر تلفظش اشتباه بود، روی ✗ بزن. در آخر «کپی فهرست» را بزن و نتیجه را برای Claude بفرست.</p>
<div id="نوار"><span id="شمار">۰ اشتباه</span><button id="کپی">کپی فهرست اشتباه‌ها</button></div>
<div id="فهرست"></div>
<textarea id="خروجی" readonly></textarea>

<script type="module">
const { MOTS } = await import('../content.js');
const پرچم‌ها = new Set(JSON.parse(localStorage.getItem('revue-audio') || '[]'));
const فهرست = document.getElementById('فهرست');
const خروجی = document.getElementById('خروجی');

function رندر() {
  document.getElementById('شمار').textContent = `${پرچم‌ها.size} اشتباه`;
  خروجی.value = [...پرچم‌ها].map((id) => `${id}\t${MOTS[id].parle}`).join('\n');
}

for (const [id, m] of Object.entries(MOTS)) {
  const div = document.createElement('div');
  div.className = 'کلمه';
  div.innerHTML = `<button class="پخش" data-id="${id}">🔊</button><span class="واژه">${m.parle}</span><small>${id}</small><button class="پرچم-دکمه">✗</button>`;
  div.querySelector('.پخش').addEventListener('click', () => new Audio(`../audio/${id}.mp3`).play());
  div.querySelector('.پرچم-دکمه').addEventListener('click', () => {
    if (پرچم‌ها.has(id)) پرچم‌ها.delete(id); else پرچم‌ها.add(id);
    localStorage.setItem('revue-audio', JSON.stringify([...پرچم‌ها]));
    div.classList.toggle('پرچم');
    رندر();
  });
  if (پرچم‌ها.has(id)) div.classList.add('پرچم');
  فهرست.append(div);
}
رندر();
document.getElementById('کپی').addEventListener('click', () => navigator.clipboard.writeText(خروجی.value));
</script>
</body>
</html>
